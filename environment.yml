# =============================================================================
# MicroInspect — Conda Environment
# =============================================================================
# Create this environment with:
#   conda env create -f environment.yml
#   conda activate microinspect
#
# This will install Python 3.11 and all required conda/pip packages.
# PyTorch is installed with CUDA 12.1 support via pip below.
# If you are on CPU-only, remove the "--extra-index-url" line from pip deps.
# =============================================================================

name: microinspect
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # Core system-level packages (best installed via conda for binary compatibility)
  - pip

  # Install all project-specific packages via pip for exact version control
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.13.0
    - torchvision==0.28.0
    - ultralytics==8.4.92
    - opencv-python==5.0.0.93
    - numpy==2.5.1
    - scipy==1.18.0
    - pandas==3.0.3
    - albumentations==2.0.8
    - scikit-learn==1.9.0
    - matplotlib==3.11.0
    - seaborn==0.13.2
    - tqdm==4.68.4
    - PyYAML==6.0.3
    - fastapi==0.115.12
    - uvicorn==0.34.3
    - python-multipart==0.0.20
