<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroInspect // Analysis Terminal</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="grid-overlay"></div>

    <main class="terminal-container">
        <header class="sys-header">
            <h1>MICROINSPECT <span>v1.0</span></h1>
            <div class="status-indicator">
                <span class="dot blinking"></span>
                <span class="status-text">SYSTEM READY</span>
            </div>
        </header>

        <section class="control-panel">
            <div class="panel-header">MODE SELECTION</div>
            <div class="radio-group">
                <label class="radio-btn">
                    <input type="radio" name="method" value="dl" checked>
                    <span class="radio-label">DEEP_LEARNING [YOLO]</span>
                </label>
                <label class="radio-btn">
                    <input type="radio" name="method" value="classical">
                    <span class="radio-label">CLASSICAL [TEMPLATE]</span>
                </label>
                <label class="radio-btn">
                    <input type="radio" name="method" value="classical_topological">
                    <span class="radio-label">CLASSICAL [TOPOLOGICAL]</span>
                </label>
            </div>
        </section>

        <section class="input-panel">
            <div class="panel-header">DATA INPUT</div>

            <div class="dropzone-container">
                <div id="dropzone-test" class="dropzone">
                    <input type="file" id="file-test" accept="image/*" hidden>
                    <div class="dropzone-content">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="square">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <span>INSERT TEST_IMAGE</span>
                    </div>
                    <div class="file-preview" id="preview-test"></div>
                    <div class="file-name" id="filename-test"
                        style="position: absolute; bottom: 5px; width: 100%; text-align: center; background: rgba(0,0,0,0.7); font-size: 0.8rem; padding: 2px 0;">
                    </div>
                </div>

                <div id="dropzone-template" class="dropzone hidden">
                    <input type="file" id="file-template" accept="image/*" hidden>
                    <div class="dropzone-content">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="square">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <span>INSERT TEMPLATE_IMAGE</span>
                    </div>
                    <div class="file-preview" id="preview-template"></div>
                    <div class="file-name" id="filename-template"
                        style="position: absolute; bottom: 5px; width: 100%; text-align: center; background: rgba(0,0,0,0.7); font-size: 0.8rem; padding: 2px 0;">
                    </div>
                </div>
            </div>

            <button id="btn-analyze" class="action-btn">
                <span class="btn-text">INITIATE_SCAN()</span>
                <div class="scan-line"></div>
            </button>
        </section>

        <section id="output-panel" class="output-panel hidden">
            <div class="panel-header">ANALYSIS OUTPUT <span id="output-method"></span></div>
            <div id="results-container" class="results-container">
                <!-- Results populated by JS -->
            </div>
            <div class="log-container">
                <div class="panel-header small">EXECUTION_LOG</div>
                <pre id="execution-log"></pre>
            </div>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>

</html>
